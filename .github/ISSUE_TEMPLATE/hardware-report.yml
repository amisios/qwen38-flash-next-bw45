name: Hardware report / benchmark
description: Share how it runs on your machine, or a failed attempt.
title: "[Hardware] GPU / CPU / RAM: result"
labels: ["hardware-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Redact hostnames, IP addresses, private paths and prompts before posting.
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - Works, benchmark attached
        - Works, but slower than expected
        - Fails to start or crashes
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU
      placeholder: "GPU model and VRAM, PCIe generation and lanes, also drives a display: yes/no"
    validations:
      required: true
  - type: input
    id: cpu
    attributes:
      label: CPU
      placeholder: "CPU model, cores, number of L3 domains (CCDs)"
    validations:
      required: true
  - type: input
    id: ram
    attributes:
      label: RAM
      placeholder: "8x16 GB DDR5-4800, all channels populated"
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: System
      description: OS, kernel, NVIDIA driver, docker compose version, image tag or commit, output of `make preflight`.
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Startup plan and settings
      description: The `[qwen38-bw45]` lines from the server log, the logged `GPU KV cache size`, and any variables you changed in `.env`.
      render: text
  - type: textarea
    id: results
    attributes:
      label: Results
      description: The `make bench` table or JSON (run it twice if the first start compiled kernels), peak GPU memory, or the error.
      render: text
    validations:
      required: true
